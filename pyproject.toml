[project]
name = "fastapi-review-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "openai>=3.46.0",
    "pydantic-settings>=2.16.2",
]

# uv run fastapi dev 명령이 실행할 앱의 위치. "app/main.py 파일의 app 객체"라는 뜻이다.
[tool.fastapi]
entrypoint = "app.main:app"
